<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PingRadar — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: '#0A0D12',
                        panel: '#12161D',
                        border: '#232935',
                        ink: '#E6E9EF',
                        muted: '#7C8798',
                        up: '#34D399',
                        down: '#F87171',
                        brand: '#38BDF8',
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .radar-ring { animation: radar-sweep 3s linear infinite; }
        @keyframes radar-sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            .radar-ring { animation: none; }
        }
    </style>
</head>
<body class="bg-base text-ink min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-sm">
        <!-- Logo mark -->
        <div class="flex flex-col items-center mb-8">
            <div class="relative w-14 h-14 mb-4">
                <svg viewBox="0 0 56 56" class="w-14 h-14">
                    <circle cx="28" cy="28" r="26" fill="none" stroke="#232935" stroke-width="1.5"/>
                    <circle cx="28" cy="28" r="17" fill="none" stroke="#232935" stroke-width="1.5"/>
                    <circle cx="28" cy="28" r="8" fill="none" stroke="#232935" stroke-width="1.5"/>
                    <circle cx="28" cy="28" r="2.5" fill="#38BDF8"/>
                </svg>
                <svg viewBox="0 0 56 56" class="w-14 h-14 absolute inset-0 radar-ring">
                    <path d="M28 28 L28 2 A26 26 0 0 1 48 12 Z" fill="#38BDF8" opacity="0.15"/>
                </svg>
            </div>
            <h1 class="text-xl font-semibold tracking-tight text-ink">PingRadar</h1>
            <p class="text-muted text-sm mt-1">Sign in to your monitoring dashboard</p>
        </div>

        <!-- Card -->
        <div class="bg-panel border border-border rounded-lg p-6">
            {% if form.errors %}
            <div class="mb-4 px-3 py-2 bg-down/10 border border-down/30 rounded text-down text-sm">
                Incorrect username or password.
            </div>
            {% endif %}

            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-medium text-muted mb-1.5 uppercase tracking-wide">Username</label>
                    <input type="text" name="username" required autofocus
                        class="w-full bg-base border border-border rounded-md px-3 py-2 text-sm text-ink placeholder-muted focus:outline-none focus:ring-2 focus:ring-brand focus:border-brand transition"
                        placeholder="you">
                </div>
                <div>
                    <label class="block text-xs font-medium text-muted mb-1.5 uppercase tracking-wide">Password</label>
                    <input type="password" name="password" required
                        class="w-full bg-base border border-border rounded-md px-3 py-2 text-sm text-ink placeholder-muted focus:outline-none focus:ring-2 focus:ring-brand focus:border-brand transition"
                        placeholder="••••••••">
                </div>
                <button type="submit"
                    class="w-full bg-brand text-base font-semibold text-sm rounded-md py-2.5 mt-2 hover:bg-brand/90 transition">
                    Sign in
                </button>
                <p class="text-center text-muted text-xs mt-6">
                    Don't have an account?
                    <a href="{% url 'signup' %}" class="text-brand hover:underline">Sign up</a>
                </p>
            </form>
        </div>

        <p class="text-center text-muted text-xs mt-6">Continuous scanning, instant alerts.</p>
    </div>

</body>
</html>
