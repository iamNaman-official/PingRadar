<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PingRadar — Sign up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: '#0A0D12',
                        panel: '#12161D',
                        border: '#232935',
                        ink: '#E6E9EF',
                        muted: '#7C8798',
                        down: '#F87171',
                        brand: '#38BDF8',
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        input {
            width: 100%;
            background: #0A0D12;
            border: 1px solid #232935;
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            color: #E6E9EF;
        }
        input:focus {
            outline: none;
            border-color: #38BDF8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4);
        }
        .errorlist {
            color: #F87171;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            list-style: none;
            padding: 0;
        }
        .helptext {
            color: #7C8798;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            display: block;
        }
    </style>
</head>
<body class="bg-base text-ink min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-sm">
        <div class="flex flex-col items-center mb-8">
            <svg viewBox="0 0 56 56" class="w-14 h-14 mb-4">
                <circle cx="28" cy="28" r="26" fill="none" stroke="#232935" stroke-width="1.5"/>
                <circle cx="28" cy="28" r="17" fill="none" stroke="#232935" stroke-width="1.5"/>
                <circle cx="28" cy="28" r="8" fill="none" stroke="#232935" stroke-width="1.5"/>
                <circle cx="28" cy="28" r="2.5" fill="#38BDF8"/>
            </svg>
            <h1 class="text-xl font-semibold tracking-tight text-ink">Create your account</h1>
            <p class="text-muted text-sm mt-1">Start monitoring in under a minute</p>
        </div>

        <div class="bg-panel border border-border rounded-lg p-6">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {% for field in form %}
                <div>
                    <label class="block text-xs font-medium text-muted mb-1.5 uppercase tracking-wide">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.help_text %}
                        <span class="helptext">{{ field.help_text }}</span>
                    {% endif %}
                    {{ field.errors }}
                </div>
                {% endfor %}
                <button type="submit"
                    class="w-full bg-brand text-base font-semibold text-sm rounded-md py-2.5 mt-2 hover:bg-brand/90 transition">
                    Create account
                </button>
            </form>
        </div>

        <p class="text-center text-muted text-xs mt-6">
            Already have an account?
            <a href="{% url 'login' %}" class="text-brand hover:underline">Sign in</a>
        </p>
    </div>

</body>
</html>
