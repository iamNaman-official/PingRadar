<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PingRadar — Add Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: '#0A0D12',
                        panel: '#12161D',
                        border: '#232935',
                        ink: '#E6E9EF',
                        muted: '#7C8798',
                        brand: '#38BDF8',
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-base text-ink min-h-screen">

    <header class="border-b border-border">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center gap-2.5">
            <svg viewBox="0 0 56 56" class="w-7 h-7">
                <circle cx="28" cy="28" r="26" fill="none" stroke="#232935" stroke-width="2"/>
                <circle cx="28" cy="28" r="17" fill="none" stroke="#232935" stroke-width="2"/>
                <circle cx="28" cy="28" r="2.5" fill="#38BDF8"/>
            </svg>
            <span class="font-semibold tracking-tight">PingRadar</span>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 py-16">
        <a href="{% url 'dashboard' %}" class="text-muted text-sm hover:text-ink transition inline-block mb-6">← Back</a>

        <h1 class="text-lg font-semibold tracking-tight mb-1">Add a site to track</h1>
        <p class="text-muted text-sm mb-6">PingRadar will start scanning it on the next check cycle.</p>

        <div class="bg-panel border border-border rounded-lg p-6">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-medium text-muted mb-1.5 uppercase tracking-wide">Name</label>
                    <input type="text" name="name" required
                        class="w-full bg-base border border-border rounded-md px-3 py-2 text-sm text-ink placeholder-muted focus:outline-none focus:ring-2 focus:ring-brand focus:border-brand transition"
                        placeholder="My portfolio site">
                </div>
                <div>
                    <label class="block text-xs font-medium text-muted mb-1.5 uppercase tracking-wide">URL</label>
                    <input type="url" name="url" required
                        class="w-full bg-base border border-border rounded-md px-3 py-2 text-sm text-ink placeholder-muted focus:outline-none focus:ring-2 focus:ring-brand focus:border-brand transition"
                        placeholder="https://example.com">
                </div>
                <button type="submit"
                    class="w-full bg-brand text-base font-semibold text-sm rounded-md py-2.5 mt-2 hover:bg-brand/90 transition">
                    Add site
                </button>
            </form>
        </div>
    </main>

    <!-- Toast notification -->
    {% if error_message %}
    <div id="toast"
        class="fixed top-6 right-6 max-w-sm bg-panel border border-down/40 rounded-lg shadow-lg px-4 py-3 flex items-start gap-3 transition-all duration-300 opacity-0 translate-y-[-8px]">
        <svg class="w-5 h-5 text-down shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
        </svg>
        <p class="text-ink text-sm">{{ error_message }}</p>
    </div>

    <script>
        const TOAST_DURATION_MS = 6000; // change this to adjust how long the toast stays visible

        const toast = document.getElementById('toast');

        // Fade in
        requestAnimationFrame(() => {
            toast.classList.remove('opacity-0', 'translate-y-[-8px]');
        });

        // Auto-dismiss after TOAST_DURATION_MS
        setTimeout(() => {
            toast.classList.add('opacity-0', 'translate-y-[-8px]');
            setTimeout(() => toast.remove(), 300); // wait for fade-out transition to finish
        }, TOAST_DURATION_MS);
    </script>
    {% endif %}

</body>
</html>
